# Envelope type manifest — single source of truth for both Go and TypeScript.
#
# This file is consumed by:
#   - go-envelopes (this repo): loaded via go:embed at runtime to seed the
#     core type registry. See registry.go (LoadCore) and types.go.
#   - ts-envelopes (separate repo): codegen reads it to emit Zod schemas
#     and TypeScript types.
#
# Adding a new core envelope type:
#   1. Add an entry here (type + optional component/export for TS rendering).
#   2. Drop a JSON Schema at manifest/schemas/<type>.schema.json validating
#      the envelope's `data` payload (optional — entries without a schema
#      register without one, and validation passes on type-name alone).
#   3. Add tests covering known-good and known-bad payloads.
#   4. Tag a minor release. ts-envelopes pulls from this manifest.
#
# If a type has no frontend component yet, omit `component` and `export`.
# Go registers it for validation; TS codegen skips component generation.
#
# Runtime envelope instance fields (not manifest fields — they live on the
# Envelope struct in types.go):
#   - Presentation: rendering hint (inline/modal/drawer/sidecar/fullscreen).
#   - Trace: observability metadata (agentId, sessionId, etc.).
# Host-specific routing fields (e.g. a host's `target` / `render_target`
# panel-routing hints) are NOT modeled by go-envelopes; they belong on each
# host's own wrapper struct. See docs/manifest-spec.md for the full schema
# spec.

core:
  # Generic primitives
  - type: document-viewer
    component: components/chat/envelopes/DocumentViewerCard
    export: DocumentViewerCard

  - type: report-card
    component: components/chat/envelopes/ReportCard
    export: ReportCard

  - type: error-report
    component: components/chat/envelopes/ErrorCard
    export: ErrorCard

  - type: approval-card
    component: components/chat/envelopes/ApprovalCard
    export: ApprovalCard
    # props discriminator: EnvelopeRenderer feeds the envelope's `approval`
    # field to the card as the `approval` prop instead of the default `data`.
    props: approval

  - type: proposal-card
    component: components/chat/envelopes/ProposalCard
    export: ProposalCard
    # props discriminator: EnvelopeRenderer feeds the envelope's first
    # proposal as the `proposal` prop.
    props: proposal

  # Work system (todo/plan)
  #
  # `todo-list` was retired as a standalone type (Phase 6,
  # TASKS/phase-6/01-rebuild-todo-list-as-composition.md) — it is now a
  # `list-card` composition: `list-card`'s schema grew a `data_source`
  # pointer (`{kind: "todos", scope, scope_id}`) plus a per-item `status`
  # field, and the emitter (internal/selftools/self_tools_transport.go's
  # callTodoList) produces `type: "list-card"` instead of its own type.
  # See manifest/schemas/list-card.schema.json.
  #
  # `plan-review` was retired as a standalone type (Phase 6,
  # TASKS/phase-6/02-rebuild-plan-review-as-composition.md) — it is now a
  # `list-card` + `confirmation-card` composition: `list-card`'s schema grew
  # an optional `plan_id` (live step list + toggle via useTogglePlanStep)
  # and `confirmation-card`'s schema grew the same optional `plan_id` (live
  # approve/reject/request-changes via useApprovePlan/useRejectPlan). The
  # emitter (internal/selftools/self_tools.go's plan_create tool
  # description) now instructs the agent to emit both envelope blocks
  # instead of a single `plan-review` block. See
  # manifest/schemas/list-card.schema.json and
  # manifest/schemas/confirmation-card.schema.json.

  # Reusable primitives (Phase 7)
  - type: info-card
    component: components/chat/envelopes/primitives/InfoCard
    export: InfoCard

  - type: list-card
    component: components/chat/envelopes/primitives/ListCard
    export: ListCard

  - type: metric-card
    component: components/chat/envelopes/primitives/MetricCard
    export: MetricCard

  - type: progress-card
    component: components/chat/envelopes/primitives/ProgressCard
    export: ProgressCard

  - type: confirmation-card
    component: components/chat/envelopes/primitives/ConfirmationCard
    export: ConfirmationCard

  - type: table-card
    component: components/chat/envelopes/primitives/TableCard
    export: TableCard

  - type: timeline-card
    component: components/chat/envelopes/primitives/TimelineCard
    export: TimelineCard

  - type: diff-card
    component: components/chat/envelopes/primitives/DiffCard
    export: DiffCard

  # Compact downloadable-artifact card surfaced in the bottom chat drawer.
  # Default render-target = bottom_chat_drawer (set in the schema).
  # Auto-closes on Download or Dismiss.
  - type: artifact-mini
    component: components/chat/envelopes/ArtifactMiniCard
    export: ArtifactMiniCard

  # Backend-only (registered for validation, no frontend component yet)
  - type: session-task

  # Subagent spawn approval. Composed over ApprovalCard (TASKS/phase-6/03) —
  # same component/export as approval-card, discriminated internally by
  # envelope.type. Subagent-specific fields (run_id/role/prompt/mode/...)
  # ride in `data` alongside the same risk_level convention approval-card
  # uses. Wire type stays `subagent-spawn-approval` unchanged: the real
  # emitter (internal/subagent/service.go), the registered response handler
  # (internal/chat/envelope_response_subagent.go), and the recovery-
  # rehydration gate (internal/api/sessions.go) all key off this literal
  # string. See docs/engineering/architecture/08-cards.md.
  - type: subagent-spawn-approval
    component: components/chat/envelopes/ApprovalCard
    export: ApprovalCard

  # Chat-loop terminal pause envelope. Renders when the loop exits
  # abnormally (max turns, hard ceiling, idle timeout, runaway failures)
  # so the user sees a termination card instead of silence.
  - type: chat-loop-terminated
    component: components/chat/envelopes/ChatLoopTerminatedCard
    export: ChatLoopTerminatedCard

  # MCP elicitation/create mid-tool user prompt. Renders inline in chat
  # with boolean (accept/decline) or string (text input) input depending
  # on schema_type. User response routes back via the protocol's response
  # envelope.
  - type: elicitation-prompt
    component: components/chat/envelopes/ElicitationPromptCard
    export: ElicitationPromptCard
